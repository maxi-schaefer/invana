server:
  port: ${INVANA_SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/invana?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}

logging:
  file:
    path: ${LOGGING_FILE_PATH:/var/log/invana}
  level:
    root: INFO

invana:
  default-admin:
    email: ${INVANA_DEFAULTADMINEMAIL:admin@example.com}
    password: ${INVANA_DEFAULTADMINPASSWORD:password}
  agent:
    token: ${INVANA_DEFAULT_AGENT_TOKEN:invana_agent_token_default}
    tls: ${INVANA_DEFAULT_AGENT_TLS:true}
    interval: ${INVANA_DEFAULT_AGENT_INTERVAL:5}
    retries: ${INVANA_DEFAULT_AGENT_RETRIES:3}
    timeout: ${INVANA_DEFAULT_AGENT_TIMEOUT:30}
    logging: ${INVANA_DEFAULT_AGENT_LOGGING:false}
  server:
    url: ${INVANA_SERVER_URL:https://localhost}

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:645c2b17e35041ebd6f2e0b32494957bb255c8482349f449d2230609a36c184d}
    expiration-time: ${SECURITY_JWT_EXPIRATION_TIME:3600000}

upload:
  dir: ${UPLOAD_DIR:/app/uploads}
